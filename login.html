<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活力AI智能平台</title>
<style>
/* ── 基础重置 ── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --white:  #ffffff;
  --black:  #0a0a0a;
  --gray1:  #f5f5f5;
  --gray2:  #e8e8e8;
  --gray3:  #999;
  --gray4:  #555;
  --accent: #111;
  --ink:    rgba(10,10,10,0.06);
  --font:   'Helvetica Neue', 'Microsoft Yahei', Arial, sans-serif;
}
html, body {
  width:100%; height:100%;
  font-family: var(--font);
  background: var(--white);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── 全屏画布（粒子层） ── */
#cvs {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0;
}

/* ── 顶部导航栏 ── */
.nav {
  position: fixed; top: 0; left: 0; right: 0;
  height: 64px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 48px;
  background: rgba(255,255,255,0.88);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--gray2);
  z-index: 100;
}
.nav-logo {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none;
}
.nav-logo svg { width:32px; height:32px; }
.nav-logo-text {
  font-size: 15px; font-weight: 800; color: var(--black);
  letter-spacing: 2px; text-transform: uppercase;
}
.nav-links {
  display: flex; align-items: center; gap: 32px;
}
.nav-links a {
  font-size: 12px; font-weight: 600; color: var(--gray3);
  text-decoration: none; letter-spacing: 1.5px; text-transform: uppercase;
  transition: color .2s;
}
.nav-links a:hover { color: var(--black); }
.nav-badge {
  font-size:11px; font-weight:700; color:var(--gray3);
  border:1px solid var(--gray2); border-radius:20px;
  padding:5px 14px; letter-spacing:1px;
}

/* ── 右下角统计浮块 ── */
.stat-float {
  position: fixed; left: 40px; bottom: 40px;
  display: flex; flex-direction: column; gap: 8px;
  z-index: 10;
}
.stat-item {
  display: flex; align-items: baseline; gap: 6px;
  opacity: 0; animation: fadeUp .6s ease forwards;
}
.stat-item:nth-child(1){ animation-delay:.3s }
.stat-item:nth-child(2){ animation-delay:.5s }
@keyframes fadeUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.stat-num {
  font-size: 26px; font-weight: 900; color: var(--black);
  line-height: 1; letter-spacing: -1px;
}
.stat-label { font-size: 11px; color: var(--gray3); letter-spacing:1px; text-transform:uppercase; }

/* ── 右下特性标签 ── */
.feat-float {
  position: fixed; right: 40px; bottom: 40px;
  display: flex; flex-direction: column; gap: 6px;
  z-index: 10; align-items: flex-end;
}
.feat-tag {
  font-size: 11px; font-weight: 600; color: var(--gray4);
  letter-spacing: 1.5px; text-transform: uppercase;
  opacity: 0; animation: fadeUp .6s ease forwards;
  display: flex; align-items: center; gap: 7px;
}
.feat-tag:nth-child(1){ animation-delay:.4s }
.feat-tag:nth-child(2){ animation-delay:.55s }
.feat-tag:nth-child(3){ animation-delay:.7s }
.feat-dot {
  width:6px; height:6px; border-radius:50%;
  background: var(--black);
  flex-shrink: 0;
}

/* ── 版权 ── */
.footer {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  font-size: 11px; color: var(--gray2); letter-spacing: 2px;
  text-transform: uppercase; z-index: 10; white-space: nowrap;
}

/* ── 主内容区 ── */
.page {
  position: relative; z-index: 2;
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 480px 1fr;
  align-items: center;
  padding-top: 64px;
}

/* ── 左侧大字标语 ── */
.hero-text {
  padding: 0 0 0 80px;
  align-self: center;
}
.hero-tagline {
  font-size: 11px; font-weight: 700; color: var(--gray3);
  letter-spacing: 4px; text-transform: uppercase; margin-bottom: 18px;
}
.hero-title {
  font-size: clamp(36px, 4vw, 64px);
  font-weight: 900; color: var(--black);
  line-height: 1.05; letter-spacing: -2px;
  text-transform: uppercase;
}
.hero-title em {
  font-style: normal; display: block;
  color: var(--gray3); font-weight: 300;
}
.hero-desc {
  margin-top: 20px; font-size: 13px;
  color: var(--gray3); line-height: 1.8;
  max-width: 300px; letter-spacing: .3px;
}
.hero-line {
  width: 40px; height: 2px; background: var(--black);
  margin-top: 30px;
}

/* ── 表单卡片（黑色） ── */
.card {
  background: var(--black);
  border-radius: 0;
  padding: 52px 48px 44px;
  position: relative;
  /* 精细噪点质感 */
  box-shadow:
    0 40px 80px rgba(0,0,0,0.18),
    0 8px 24px rgba(0,0,0,0.12);
  animation: cardIn .7s cubic-bezier(.22,1,.36,1) forwards;
  overflow: hidden;
}
.card::before {
  /* 顶部高光线 */
  content: '';
  position: absolute; top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
}
@keyframes cardIn {
  from{ opacity:0; transform:translateY(30px) }
  to  { opacity:1; transform:translateY(0) }
}

/* 卡片内顶部 LOGO 区 */
.card-top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 36px;
}
.card-logo {
  display: flex; align-items: center; gap: 10px;
}
.card-logo-mark {
  width: 36px; height: 36px;
  border: 1.5px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
.card-logo-mark::before {
  content: '';
  position: absolute; inset: 0;
  background: conic-gradient(from 0deg, rgba(255,255,255,0.08), transparent 60%);
  animation: spin 6s linear infinite;
}
@keyframes spin{ to{transform:rotate(360deg)} }
.card-logo-mark svg { width:18px; height:18px; position:relative; z-index:1; }
.card-logo-name {
  font-size: 12px; font-weight: 800; color: rgba(255,255,255,1);
  letter-spacing: 2.5px; text-transform: uppercase;
}
.card-badge {
  font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.55);
  border: 1px solid rgba(255,255,255,0.25); border-radius: 4px;
  padding: 3px 8px; letter-spacing: 1px; text-transform: uppercase;
}

/* Tab 切换 */
.tabs {
  display: flex; gap: 0; margin-bottom: 32px;
  border-bottom: 1px solid rgba(255,255,255,0.18);
}
.tab {
  flex:1; background:none; border:none; cursor:pointer;
  padding: 12px 0; font-size: 12px; font-weight: 700;
  color: rgba(255,255,255,0.5); letter-spacing: 2px; text-transform: uppercase;
  position: relative; transition: color .3s;
}
.tab::after {
  content:''; position:absolute; bottom:-1px; left:0; right:0;
  height: 2px; background: var(--white);
  transform: scaleX(0); transition: transform .3s ease;
}
.tab.active { color: var(--white); }
.tab.active::after { transform: scaleX(1); }
.tab:hover:not(.active){ color:rgba(255,255,255,0.75); }

/* 表单容器 */
.form { display:none; }
.form.show { display:block; animation: formIn .4s ease; }
@keyframes formIn{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

/* 步骤条 */
.steps {
  display: flex; gap: 4px; margin-bottom: 24px;
}
.step-seg {
  flex:1; height:2px; background:rgba(255,255,255,0.2);
  border-radius:2px; transition:background .4s ease;
}
.step-seg.on { background:var(--white); }

/* 输入框 */
.field { margin-bottom: 14px; position: relative; }
.field-label {
  display: block; font-size: 10px; font-weight: 700;
  color: rgba(255,255,255,0.65); letter-spacing: 2px; text-transform: uppercase;
  margin-bottom: 7px;
}
.field input {
  width: 100%;
  padding: 14px 16px 14px 42px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.22);
  border-radius: 4px;
  color: var(--white); font-size: 14px;
  font-family: var(--font); outline: none;
  transition: border-color .25s, background .25s;
}
.field input:focus {
  border-color: rgba(255,255,255,0.7);
  background: rgba(255,255,255,0.15);
}
.field input::placeholder { color: rgba(255,255,255,0.4); font-size:13px; }
.field-icon {
  position: absolute; left:14px; bottom:14px;
  pointer-events:none; opacity:.6;
}
.eye-toggle {
  position:absolute; right:14px; bottom:12px;
  background:none; border:none; cursor:pointer;
  opacity:.5; transition:opacity .2s; padding:2px;
}
.eye-toggle:hover{ opacity:.9; }

/* 验证码行 */
.code-row { display:flex; gap:8px; }
.code-row input { flex:1; border-radius:4px 0 0 4px; }
.code-send {
  padding: 0 16px; border: 1px solid rgba(255,255,255,0.3);
  border-left: none; border-radius: 0 4px 4px 0;
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.8); font-size: 12px; font-weight: 700;
  cursor: pointer; white-space: nowrap; letter-spacing: 1px;
  transition: all .25s; font-family: var(--font);
}
.code-send:hover { background: rgba(255,255,255,0.2); color:#fff; }
.code-send:disabled { opacity:.35; cursor:not-allowed; }

/* 快捷行 */
.quick {
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:24px; margin-top:-4px;
}
.check-label {
  display:flex; align-items:center; gap:8px;
  font-size:12px; color:rgba(255,255,255,0.6); cursor:pointer;
  letter-spacing:.5px;
}
.check-label input[type=checkbox]{ accent-color:#fff; width:13px; height:13px; }
.link-gray {
  font-size:12px; color:rgba(255,255,255,0.6); text-decoration:none;
  letter-spacing:.5px; transition:color .2s;
}
.link-gray:hover{ color:rgba(255,255,255,0.95); }

/* 主按钮（白色） */
.btn-main {
  display: block; width: 100%;
  padding: 16px 0;
  background: var(--white);
  border: none; border-radius: 4px;
  color: var(--black); font-size: 13px; font-weight: 900;
  letter-spacing: 3px; text-transform: uppercase;
  cursor: pointer; font-family: var(--font);
  transition: all .3s ease;
  margin-bottom: 24px;
  position: relative; overflow: hidden;
}
.btn-main::before {
  content:'';
  position:absolute; inset:0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transform: translateX(-100%);
  transition: transform .5s ease;
}
.btn-main:hover { transform:translateY(-2px); box-shadow: 0 8px 24px rgba(255,255,255,0.2); }
.btn-main:hover::before { transform: translateX(100%); }
.btn-main:active { transform:translateY(0); }

/* 分割线 */
.sep {
  display:flex; align-items:center; gap:12px;
  margin-bottom:18px;
}
.sep::before, .sep::after {
  content:''; flex:1; height:1px;
  background: rgba(255,255,255,0.18);
}
.sep span {
  font-size:10px; font-weight:700; color:rgba(255,255,255,0.5);
  letter-spacing:2px; text-transform:uppercase; white-space:nowrap;
}

/* 第三方登录 */
.socials { display:flex; justify-content:center; gap:12px; margin-bottom:24px; }
.soc-btn {
  width:44px; height:44px; border-radius:4px;
  border: 1px solid rgba(255,255,255,0.22);
  background: rgba(255,255,255,0.08);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:all .25s;
}
.soc-btn:hover {
  border-color: rgba(255,255,255,0.5);
  background: rgba(255,255,255,0.16);
  transform: translateY(-2px);
}
.soc-btn svg { width:20px; height:20px; }

/* 协议 */
.agree {
  text-align:center; font-size:11px;
  color:rgba(255,255,255,0.45); line-height:1.8; letter-spacing:.3px;
}
.agree a { color:rgba(255,255,255,0.7); text-decoration:none; border-bottom:1px solid rgba(255,255,255,0.3); transition:color .2s; }
.agree a:hover{ color:rgba(255,255,255,0.95); }

/* ── Toast ── */
.toast {
  position: fixed; top: 80px; left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: var(--black); color: var(--white);
  font-size: 13px; font-weight: 600;
  padding: 12px 28px; border-radius: 4px;
  letter-spacing: 1px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.2);
  z-index:999; opacity:0;
  transition: all .4s cubic-bezier(.22,1,.36,1);
  pointer-events:none; white-space:nowrap;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ── 响应式 ── */
@media(max-width:960px){
  .page{ grid-template-columns: 0 1fr 0; }
  .hero-text{ display:none; }
  .stat-float, .feat-float{ display:none; }
  .card{ margin:80px 20px 20px; }
}
</style>
</head>
<body>

<canvas id="cvs"></canvas>

<!-- ── 顶部导航 ── -->
<nav class="nav">
  <a class="nav-logo" href="#">
    <!-- 品牌 SVG：简约「V」字形闪电 -->
    <svg viewBox="0 0 32 32" fill="none">
      <defs>
        <linearGradient id="nlg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#111"/>
          <stop offset="100%" stop-color="#444"/>
        </linearGradient>
      </defs>
      <rect width="32" height="32" rx="6" fill="#0a0a0a"/>
      <path d="M10 8L16 24L22 8" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="16" cy="16" r="2" fill="white" opacity="0.5"/>
    </svg>
    <span class="nav-logo-text">Vitality AI</span>
  </a>
  <div class="nav-links">
    <a href="#">产品</a>
    <a href="#">文档</a>
    <a href="#">定价</a>
    <a href="#">关于</a>
  </div>
  <div class="nav-badge">Beta v2.6</div>
</nav>

<!-- ── 左侧统计浮块 ── -->
<div class="stat-float">
  <div class="stat-item">
    <span class="stat-num">128K</span>
    <span class="stat-label">Users</span>
  </div>
  <div class="stat-item">
    <span class="stat-num">99.9%</span>
    <span class="stat-label">Uptime</span>
  </div>
</div>

<!-- ── 右侧特性标签 ── -->
<div class="feat-float">
  <div class="feat-tag"><div class="feat-dot"></div>AI 智能对话</div>
  <div class="feat-tag"><div class="feat-dot"></div>毫秒级响应</div>
  <div class="feat-tag"><div class="feat-dot"></div>数据安全保障</div>
</div>

<!-- ── 版权 ── -->
<div class="footer">© 2026 Vitality AI · All Rights Reserved</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ── 主页面 ── -->
<main class="page">
  <!-- 左侧标语 -->
  <section class="hero-text">
    <p class="hero-tagline">Next Generation AI Platform</p>
    <h1 class="hero-title">
      JUST<br>
      <em>CREATE</em><br>
      IT.
    </h1>
    <p class="hero-desc">用 AI 赋能每一个创作者，让灵感不再受限，让每个想法都有实现的可能。</p>
    <div class="hero-line"></div>
  </section>

  <!-- 黑色表单卡片 -->
  <div class="card">
    <!-- 卡片顶 -->
    <div class="card-top">
      <div class="card-logo">
        <div class="card-logo-mark">
          <svg viewBox="0 0 18 18" fill="none">
            <path d="M5 4L9 14L13 4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="9" cy="9" r="1.5" fill="white" opacity="0.6"/>
          </svg>
        </div>
        <span class="card-logo-name">Vitality</span>
      </div>
      <div class="card-badge">Secure</div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">登录</button>
      <button class="tab" onclick="switchTab('register')">注册</button>
    </div>

    <!-- 登录 -->
    <div class="form show" id="login-form">
      <div class="field">
        <label class="field-label">账号</label>
        <div class="field-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="8" r="4" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
            <path d="M4 20c0-3.3 3.6-6 8-6s8 2.7 8 6" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <input type="text" id="li-acc" placeholder="手机号 / 邮箱 / 用户名">
      </div>
      <div class="field">
        <label class="field-label">密码</label>
        <div class="field-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="11" width="18" height="11" rx="2" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
            <path d="M7 11V7c0-2.2 2.2-4 5-4s5 1.8 5 4v4" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
          </svg>
        </div>
        <input type="password" id="li-pwd" placeholder="请输入密码">
        <button class="eye-toggle" onclick="toggleEye('li-pwd',this)" type="button">
          <svg id="eye-li-pwd" width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
            <circle cx="12" cy="12" r="3" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
          </svg>
        </button>
      </div>
      <div class="quick">
        <label class="check-label"><input type="checkbox" id="remember">记住我</label>
        <a href="#" class="link-gray">忘记密码？</a>
      </div>
      <button class="btn-main" onclick="handleLogin()">Log In</button>
      <div class="sep"><span>or continue with</span></div>
      <div class="socials">
        <!-- 微信 -->
        <div class="soc-btn" title="微信" onclick="socialLogin('微信')">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M9.5 4C5.9 4 3 6.5 3 9.5c0 1.7.9 3.2 2.3 4.2L4.5 16l2.6-1.3c.8.2 1.6.3 2.4.3-.2-.5-.3-1-.3-1.5 0-2.7 2.6-4.9 5.8-4.9h.4C14.9 6 12.4 4 9.5 4z" fill="#07C160"/>
            <path d="M20.5 13.5c0-2.5-2.3-4.5-5.2-4.5-2.9 0-5.3 2-5.3 4.5s2.4 4.5 5.3 4.5c.7 0 1.3-.1 1.9-.3L19.5 19l-.7-2.1c1.1-.9 1.7-2.1 1.7-3.4z" fill="#07C160"/>
          </svg>
        </div>
        <!-- QQ -->
        <div class="soc-btn" title="QQ" onclick="socialLogin('QQ')">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 3C8.1 3 5 6.4 5 10.5c0 2.9 1.3 5.4 3.3 6.8L7.5 20h2c.5.5 1.5 1 2.5 1s2-.5 2.5-1h2l-.8-2.7c2-1.4 3.3-3.9 3.3-6.8C19 6.4 15.9 3 12 3z" fill="#12B7F5"/>
            <path d="M5 13c-1 0-2 1-2 2s1 2 2 2M19 13c1 0 2 1 2 2s-1 2-2 2" stroke="#12B7F5" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <!-- GitHub -->
        <div class="soc-btn" title="GitHub" onclick="socialLogin('GitHub')">
          <svg viewBox="0 0 24 24" fill="rgba(255,255,255,0.75)">
            <path d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0012 2z"/>
          </svg>
        </div>
        <!-- 微博 -->

    <!-- 注册 -->
    <div class="form" id="register-form">

      <div class="field">

        <div class="field-icon">

          </svg>

        <input type="password" id="rg-pwd2" placeholder="再次输入密码">

      <button class="btn-main" onclick="handleRegister()">Create Account</button>
      <p class="agree">注册即代表同意 <a href="#">用户服务协议</a> 与 <a href="#">隐私政策</a></p>
    </div>
  </div>

  <!-- 右侧空列 -->
  <div></div>
</main>

<script>
/* ════════════════════════════════════════
   UI 逻辑
════════════════════════════════════════ */
function switchTab(t) {
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active', t==='login'?i===0:i===1));
  document.getElementById('login-form').classList.toggle('show', t==='login');
  document.getElementById('register-form').classList.toggle('show', t==='register');
}
function toggleEye(id, btn) {
  const el = document.getElementById(id);
  const show = el.type==='password';
  el.type = show ? 'text' : 'password';
  btn.style.opacity = show ? '0.8' : '0.35';
}
function showToast(msg, dur=2400) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), dur);
}
function sendCode() {
  const v = document.getElementById('rg-phone').value.trim();
  if(!v){ showToast('请先输入手机号或邮箱'); return; }
  const btn = document.getElementById('code-btn');
  let c=60; btn.disabled=true; btn.textContent=`${c}s`;
  const ti=setInterval(()=>{ c--; btn.textContent=`${c}s`; if(c<=0){clearInterval(ti);btn.disabled=false;btn.textContent='获取验证码';}},1000);
  showToast('验证码已发送');
}
function updStep() {
  const v = ['rg-name','rg-phone','rg-code'].map(id=>document.getElementById(id).value.trim().length>0);
  ['s1','s2','s3'].forEach((id,i)=>document.getElementById(id).classList.toggle('on',v[i]));
}
async function handleLogin() {
  const a=document.getElementById('li-acc').value.trim();
  const p=document.getElementById('li-pwd').value;
  if(!a){showToast('请输入账号');return;}
  if(!p){showToast('请输入密码');return;}
  showToast('登录中，请稍候…');
  
  try {
    const res = await fetch('http://localhost:8000/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: a, password: p})
    });
    const data = await res.json();
    if(res.ok) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('username', a);
      showToast('登录成功！');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
    } else {
      showToast(data.detail || '登录失败');
    }
  } catch(e) {
    showToast('网络错误，请确保后端已启动');
  }
}
async function handleRegister() {
  const n=document.getElementById('rg-name').value.trim();
  const ph=document.getElementById('rg-phone').value.trim();
  const c=document.getElementById('rg-code').value.trim();
  const p=document.getElementById('rg-pwd').value;
  const p2=document.getElementById('rg-pwd2').value;
  if(!n){showToast('请输入用户名');return;}
  if(!ph){showToast('请输入手机号/邮箱');return;}
  if(!c){showToast('请输入验证码');return;}
  if(p.length<8){showToast('密码至少 8 位');return;}
  if(p!==p2){showToast('两次密码不一致');return;}
  
  showToast('注册中…');
  try {
    const res = await fetch('http://localhost:8000/api/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: n, password: p, email: ph})
    });
    const data = await res.json();
    if(res.ok) {
      showToast('注册成功，请登录');
      setTimeout(() => switchTab('login'), 1500);
    } else {
      showToast(data.detail || '注册失败');
    }
  } catch(e) {
    showToast('网络错误，请确保后端已启动');
  }
}
function socialLogin(n){showToast(`通过 ${n} 授权登录中…`);}

/* ════════════════════════════════════════
   高帧率粒子系统（白色背景专版）
   ─ 极简黑白灰色调，保持简约气质
   ─ 大型浮动光晕 + 细丝粒子连网
   ─ 鼠标斥力 + 点击波纹爆炸
   ─ requestAnimationFrame 全程 60fps
════════════════════════════════════════ */
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
let W, H;
function resize(){ W=cvs.width=innerWidth; H=cvs.height=innerHeight; }
resize(); window.addEventListener('resize', resize);

// 调色盘：白底上的深色细粒
const PAL = [
  [10,10,10],     // 纯黑
  [80,80,80],     // 深灰
  [140,140,140],  // 中灰
  [200,200,200],  // 浅灰
  [0,180,200],    // 青
  [100,160,255],  // 蓝
];
const rc = ()=>PAL[Math.floor(Math.random()*PAL.length)];

/* ── 普通网格粒子 ── */
class P {
  constructor(){ this.init(true); }
  init(first=false){
    this.x = first ? Math.random()*W : (Math.random()<.5?-2:W+2);
    this.y = first ? Math.random()*H : Math.random()*H;
    this.r = Math.random()*1.8+.4;
    this.vx = (Math.random()-.5)*.7;
    this.vy = (Math.random()-.5)*.7;
    this.col = rc();
    this.maxA = Math.random()*.55+.1;
    this.a = 0;
    this.life = Math.random()*350+120;
    this.age = 0;
    this.trail = [];
  }
  update(){
    if(this.x<0||this.x>W) this.vx*=-1;
    if(this.y<0||this.y>H) this.vy*=-1;
    // 速度限制，避免过快
    const spd = Math.sqrt(this.vx*this.vx+this.vy*this.vy);
    if(spd>1.2){ this.vx*=.95; this.vy*=.95; }
    this.x+=this.vx; this.y+=this.vy; this.age++;
    const t=this.age/this.life;
    this.a = t<.1 ? this.maxA*(t/.1) : t>.8 ? this.maxA*((1-t)/.2) : this.maxA;
    if(spd>.4){ this.trail.push({x:this.x,y:this.y}); if(this.trail.length>10)this.trail.shift(); }
    if(this.age>this.life) this.init();
  }
  draw(){
    // 拖尾
    const [r,g,b]=this.col;
    this.trail.forEach((t,i)=>{
      const fa=this.a*(i/this.trail.length)*.4;
      if(fa<.01)return;
      ctx.save(); ctx.globalAlpha=fa;
      ctx.fillStyle=`rgb(${r},${g},${b})`;
      ctx.beginPath(); ctx.arc(t.x,t.y,this.r*.5,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });
    // 本体
    ctx.save();
    ctx.globalAlpha=this.a;
    ctx.shadowColor=`rgba(${r},${g},${b},.6)`;
    ctx.shadowBlur=this.r*5;
    ctx.fillStyle=`rgb(${r},${g},${b})`;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

/* ── 浮动光斑（大，低透，给背景增加微妙光感） ── */
class Blob {
  constructor(){ this.reset(); }
  reset(){
    this.x=Math.random()*W; this.y=Math.random()*H;
    this.r=Math.random()*220+80;
    const c=PAL[Math.floor(Math.random()*3)]; // 只用深色系
    this.c=c;
    this.a=Math.random()*.025+.008;
    this.vx=(Math.random()-.5)*.35; this.vy=(Math.random()-.5)*.35;
    this.life=Math.random()*500+200; this.age=0;
  }
  update(){
    this.x+=this.vx; this.y+=this.vy; this.age++;
    if(this.x<-this.r||this.x>W+this.r) this.vx*=-1;
    if(this.y<-this.r||this.y>H+this.r) this.vy*=-1;
    if(this.age>this.life) this.reset();
  }
  draw(){
    const [r,g,b]=this.c;
    const gd=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r);
    gd.addColorStop(0,`rgba(${r},${g},${b},${this.a})`);
    gd.addColorStop(1,`rgba(${r},${g},${b},0)`);
    ctx.save(); ctx.fillStyle=gd;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

/* ── 点击波纹爆炸 ── */
class Ripple {
  constructor(x,y){
    this.x=x; this.y=y; this.r=0; this.maxR=Math.random()*80+40;
    this.life=40; this.age=0;
  }
  update(){ this.r=this.maxR*(this.age/this.life); this.age++; }
  draw(){
    const a=(1-this.age/this.life)*.5;
    ctx.save();
    ctx.globalAlpha=a;
    ctx.strokeStyle='rgba(0,0,0,0.6)';
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}
class Burst {
  constructor(x,y){
    this.x=x; this.y=y;
    const a=Math.random()*Math.PI*2, s=Math.random()*5+1.5;
    this.vx=Math.cos(a)*s; this.vy=Math.sin(a)*s;
    this.r=Math.random()*2+.5;
    this.col=rc(); this.a=1; this.life=50; this.age=0;
  }
  update(){ this.x+=this.vx; this.y+=this.vy; this.vx*=.93; this.vy*=.93; this.age++; this.a=1-this.age/this.life; }
  draw(){
    const [r,g,b]=this.col;
    ctx.save(); ctx.globalAlpha=this.a;
    ctx.shadowColor=`rgba(${r},${g},${b},.8)`; ctx.shadowBlur=8;
    ctx.fillStyle=`rgb(${r},${g},${b})`;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

/* ── 连线 ── */
function drawWeb(pts){
  for(let i=0;i<pts.length;i++){
    for(let j=i+1;j<pts.length;j++){
      const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d>110)continue;
      const a=(1-d/110)*0.12;
      ctx.save();
      ctx.globalAlpha=a;
      const gd=ctx.createLinearGradient(pts[i].x,pts[i].y,pts[j].x,pts[j].y);
      const [r1,g1,b1]=pts[i].col, [r2,g2,b2]=pts[j].col;
      gd.addColorStop(0,`rgb(${r1},${g1},${b1})`);
      gd.addColorStop(1,`rgb(${r2},${g2},${b2})`);
      ctx.strokeStyle=gd; ctx.lineWidth=.6;
      ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[j].x,pts[j].y); ctx.stroke();
      ctx.restore();
    }
  }
}

const pts   = Array.from({length:140},()=>new P());
const blobs = Array.from({length:6},()=>new Blob());
let ripples=[], bursts=[];

/* 鼠标斥力 */
let mx=-9999,my=-9999;
document.addEventListener('mousemove',e=>{
  mx=e.clientX; my=e.clientY;
  pts.forEach(p=>{
    const dx=p.x-mx, dy=p.y-my;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<100&&d>0){ p.vx+=dx/d*.1; p.vy+=dy/d*.1; }
  });
});
/* 点击爆炸 */
document.addEventListener('click',e=>{
  for(let i=0;i<3;i++) ripples.push(new Ripple(e.clientX,e.clientY));
  for(let i=0;i<24;i++) bursts.push(new Burst(e.clientX,e.clientY));
});

/* 主循环 */
let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  // 帧率控制：只需每帧都跑，浏览器会自动对齐 60fps
  ctx.clearRect(0,0,W,H);

  blobs.forEach(b=>{ b.update(); b.draw(); });
  drawWeb(pts);
  pts.forEach(p=>{ p.update(); p.draw(); });

  // 鼠标圆形高亮
  if(mx>-100){
    const gd=ctx.createRadialGradient(mx,my,0,mx,my,70);
    gd.addColorStop(0,'rgba(0,0,0,0.05)');
    gd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.save(); ctx.fillStyle=gd;
    ctx.beginPath(); ctx.arc(mx,my,70,0,Math.PI*2); ctx.fill(); ctx.restore();
  }

  ripples=ripples.filter(r=>r.age<r.life);
  ripples.forEach(r=>{ r.update(); r.draw(); });
  bursts=bursts.filter(b=>b.age<b.life);
  bursts.forEach(b=>{ b.update(); b.draw(); });
}
requestAnimationFrame(loop);
</script>
